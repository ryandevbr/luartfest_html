<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteiro Musical - Lu Art' Fest</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #f39c12; text-align: center; }
        h2 { font-size: 16px; color: #666; text-align: center; margin-top: -10px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #f39c12; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button:hover { background-color: #e67e22; }
        .sucesso { display: none; text-align: center; color: green; font-weight: bold; margin-top: 20px; }
        .erro { color: red; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lu Art' Fest</h1>
        <h2 id="tituloEvento">Carregando...</h2>
        
        <form id="formMusica">
            <label>Entrada dos Pais</label>
            <input type="text" id="entrada_pais" placeholder="Música escolhida...">
            
            <label>Entrada dos Padrinhos</label>
            <input type="text" id="entrada_padrinhos" placeholder="Música escolhida...">
            
            <label>Entrada Principal (Noiva/Noivo)</label>
            <input type="text" id="entrada_principal" placeholder="Música escolhida...">
            
            <label>Valsa (Se houver)</label>
            <input type="text" id="valse" placeholder="Música escolhida...">
            
            <label>Músicas Obrigatórias na Boate</label>
            <textarea id="boate_obrigatorias" rows="3" placeholder="Liste as músicas que não podem faltar..."></textarea>
            
            <label>Músicas Proibidas na Boate</label>
            <textarea id="boate_proibidas" rows="3" placeholder="Liste as músicas que não devem tocar..."></textarea>
            
            <button type="submit" id="btnEnviar">Enviar Roteiro</button>
            <div class="sucesso" id="msgSucesso">✅ Roteiro enviado com sucesso! Obrigado.</div>
            <div class="erro" id="msgErro"></div>
        </form>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        // Substitua pelos seus dados do Supabase
        const SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
        const SUPABASE_ANON_KEY = "SUA-CHAVE-ANON-AQUI";

        const params = new URLSearchParams(window.location.search);
        const eventoId = params.get('id');

        if (!eventoId) {
            document.getElementById('tituloEvento').innerText = "Link inválido. Falta o ID do evento.";
        } else {
            // Busca os dados do evento para mostrar o nome do cliente
            fetch(`${SUPABASE_URL}/rest/v1/eventos?id=eq.${eventoId}&select=*,clientes(nome_completo),tipos_evento(nome)`, {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data.length > 0) {
                    const ev = data[0];
                    const nome = ev.clientes?.nome_completo || "Cliente";
                    const tipo = ev.tipos_evento?.nome || "Evento";
                    document.getElementById('tituloEvento').innerText = `Roteiro Musical: ${nome} (${tipo})`;
                } else {
                    document.getElementById('tituloEvento').innerText = "Evento não encontrado.";
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('tituloEvento').innerText = "Erro ao carregar dados do evento.";
            });
        }

        // Envio do formulário
        document.getElementById('formMusica').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!eventoId) return;

            const btn = document.getElementById('btnEnviar');
            btn.innerText = "Enviando...";
            document.getElementById('msgErro').innerText = "";

            const dados = {
                entrada_pais: document.getElementById('entrada_pais').value,
                entrada_padrinhos: document.getElementById('entrada_padrinhos').value,
                entrada_principal: document.getElementById('entrada_principal').value,
                valse: document.getElementById('valse').value,
                boate_obrigatorias: document.getElementById('boate_obrigatorias').value,
                boate_proibidas: document.getElementById('boate_proibidas').value
            };

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/musicas?id=${eventoId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    document.getElementById('formMusica').style.display = 'none';
                    document.getElementById('msgSucesso').style.display = 'block';
                } else {
                    const err = await response.json();
                    document.getElementById('msgErro').innerText = "Erro ao enviar: " + (err.error || "Tente novamente.");
                    btn.innerText = "Enviar Roteiro";
                }
            } catch (error) {
                document.getElementById('msgErro').innerText = "Erro de conexão. Verifique sua internet.";
                btn.innerText = "Enviar Roteiro";
            }
        });
    </script>
</body>
</html>
